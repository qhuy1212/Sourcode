<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cart - QH Fashion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: #f4f7fb;
      }
      .nav-link.active {
        color: #ffb703 !important;
      }
      .product-row:hover {
        background: #fff;
      }
      .checkout-card {
        background: #fff;
        border: none;
      }
      .cart-total {
        font-size: 1.15rem;
      }
      .btn-clear {
        background: #ff6f3c;
        border: none;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">QH Fashion</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link active" href="cart.html">My Cart</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="container py-5">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div>
                <h3 class="mb-1">My Cart</h3>
                <p class="text-muted mb-0">Review items, update quantities, or remove products before checkout.</p>
              </div>
              <button id="clear-cart" class="btn btn-clear text-white">Clear Cart</button>
            </div>
            <div id="cart-items"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card checkout-card shadow-sm p-4 sticky-top" style="top: 1rem;">
            <h5 class="mb-3">Order Summary</h5>
            <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
            <div class="d-flex justify-content-between mb-2"><span>Tax</span><span id="tax">$0.00</span></div>
            <hr />
            <div class="d-flex justify-content-between fw-bold cart-total"><span>Total</span><span id="total">$0.00</span></div>
            <button id="checkout-btn" class="btn btn-primary btn-lg w-100 mt-4">Checkout Now</button>
            <div id="checkout-feedback" class="mt-3"></div>
          </div>
        </div>
      </div>
    </section>

    <footer class="bg-dark text-white py-4 text-center small">
      QH Fashion Cart &copy; 2026. Your cart is held in localStorage.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const cartKey = 'QH FashionCart';
      const cartItemsContainer = document.getElementById('cart-items');
      const subtotalEl = document.getElementById('subtotal');
      const taxEl = document.getElementById('tax');
      const totalEl = document.getElementById('total');
      const checkoutFeedback = document.getElementById('checkout-feedback');
      const clearCartBtn = document.getElementById('clear-cart');

      function highlightNav() {
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link.href.includes(window.location.pathname.split('/').pop())) {
            link.classList.add('active');
          }
        });
      }

      function loadCart() {
        const cart = JSON.parse(localStorage.getItem(cartKey) || '[]');
        if (!cart.length) {
          cartItemsContainer.innerHTML = '<div class="alert alert-info">Your cart is empty. Add items from the home page to start shopping.</div>';
          updateSummary(cart);
          return;
        }

        cartItemsContainer.innerHTML = cart.map(item => {
          return `
            <div class="row align-items-center border-bottom py-3 product-row">
              <div class="col-3">
                <img src="${item.image}" class="img-fluid rounded-3" alt="${item.title}" />
              </div>
              <div class="col-9">
                <div class="d-flex justify-content-between align-items-start">
                  <div>
                    <h5 class="mb-1">${item.title}</h5>
                    <p class="text-muted mb-2">$${item.price.toFixed(2)} each</p>
                  </div>
                  <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${item.id})">Remove</button>
                </div>
                <div class="d-flex align-items-center gap-2 mt-2">
                  <input type="number" min="1" value="${item.quantity}" class="form-control form-control-sm" style="width: 90px;" onchange="updateQuantity(${item.id}, this.value)" />
                  <span class="text-muted">Quantity</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        updateSummary(cart);
      }

      function updateSummary(cart) {
        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const tax = subtotal * 0.08;
        const total = subtotal + tax;
        subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
        taxEl.textContent = `$${tax.toFixed(2)}`;
        totalEl.textContent = `$${total.toFixed(2)}`;
      }

      function saveCart(cart) {
        localStorage.setItem(cartKey, JSON.stringify(cart));
        loadCart();
      }

      function removeItem(id) {
        const cart = JSON.parse(localStorage.getItem(cartKey) || '[]');
        const updated = cart.filter(item => item.id !== id);
        saveCart(updated);
      }

      function updateQuantity(id, quantity) {
        const cart = JSON.parse(localStorage.getItem(cartKey) || '[]');
        const updated = cart.map(item => item.id === id ? { ...item, quantity: Math.max(1, Number(quantity)) } : item);
        saveCart(updated);
      }

      clearCartBtn.addEventListener('click', function () {
        localStorage.removeItem(cartKey);
        loadCart();
        checkoutFeedback.innerHTML = '<div class="alert alert-warning">Cart cleared successfully.</div>';
      });

      document.getElementById('checkout-btn').addEventListener('click', function () {
        const cart = JSON.parse(localStorage.getItem(cartKey) || '[]');
        if (!cart.length) {
          checkoutFeedback.innerHTML = '<div class="alert alert-danger">Add items to your cart before checkout.</div>';
          return;
        }
        localStorage.setItem(cartKey, JSON.stringify([]));
        loadCart();
        checkoutFeedback.innerHTML = '<div class="alert alert-success">Checkout complete! Your order is confirmed.</div>';
      });

      highlightNav();
      loadCart();
    </script>
  </body>
</html>
